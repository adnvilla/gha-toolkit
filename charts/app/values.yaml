# Default values for the generic `app` chart.
# Every value here can be overridden per-project via a values-<env>.yaml file
# living in the consumer repo (e.g. k8s/values-local.yaml) and passed to
# `helm upgrade --install -f`.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ""
  tag: "latest"
  # Optional immutable digest (for example sha256:...). When set, the chart renders
  # repository@digest instead of repository:tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Container port the app listens on.
containerPort: 8080

# List of { name, value } pairs injected as container env vars.
env: []
# - name: PORT
#   value: "8080"

# Optional list of envFrom sources (configMapRef/secretRef), passed through as-is.
envFrom: []

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

# Raw pass-through security contexts. Defaults stay empty for compatibility with
# existing images; set both blocks to meet Pod Security Standards `restricted`.
podSecurityContext: {}
securityContext: {}

livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

# Raw pass-through blocks: set exactly what you'd put under a Pod spec.
affinity: {}
tolerations: []
nodeSelector: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  # className: traefik
  annotations: {}
  host: ""
  path: /
  pathType: Prefix

# Deployment strategy. Default `rolling` preserves the single-Deployment behaviour
# used by k8s-deploy.yml. Set to `canary` (APIs) or `blueGreen` (e.g. Kafka workers)
# when using k8s-canary.yml / k8s-bluegreen.yml.
strategy:
  mode: rolling # rolling | canary | blueGreen

# Canary settings (only used when strategy.mode=canary). The stable Deployment keeps
# the rolling resource names/selectors; the canary Deployment/Service use a distinct
# instance label so they never join the stable Service endpoints.
canary:
  # Image for the canary Deployment. Workflows set these via --set on deploy.
  image:
    repository: ""
    tag: ""
    digest: ""
  replicas: 1
  # % of traffic sent to canary when trafficProvider=traefik (0–100). Ignored for
  # trafficProvider=none (canary is only reachable via canary.ingress).
  weight: 10
  # none: main Ingress → stable; optional canary.ingress for smoke tests.
  # traefik: render TraefikService + IngressRoute with weighted backends (requires
  # Traefik CRDs in the cluster). Standard Ingress is skipped in that case.
  trafficProvider: none # none | traefik
  ingress:
    enabled: false
    # Defaults to "canary.<ingress.host>" when empty and ingress.host is set.
    host: ""
    path: /
    pathType: Prefix
    annotations: {}
  # Traefik IngressRoute entryPoints when trafficProvider=traefik.
  traefik:
    entryPoints:
      - web

# Blue/green settings (only used when strategy.mode=blueGreen). Two Deployments
# (…-blue / …-green); the Service selects pods for blueGreen.activeSlot only.
# Ideal for Kafka workers: same consumer group, promote flips the active slot.
blueGreen:
  activeSlot: blue # blue | green
  # Seconds both slots may run during promote (Kafka rebalance overlap). Prefer 0.
  overlapSeconds: 0
  blue:
    replicas: 1
    image:
      repository: ""
      tag: ""
      digest: ""
  green:
    replicas: 0
    image:
      repository: ""
      tag: ""
      digest: ""
  # Preview Service (and optional Ingress) pointing at the INACTIVE slot, so the new
  # version can be smoke-tested before promote. Default off.
  preview:
    enabled: false
    ingress:
      enabled: false
      # Defaults to "preview.<ingress.host>" when empty and ingress.host is set.
      host: ""
      path: /
      pathType: Prefix
      # className: "" # falls back to ingress.className
      annotations: {}

# Opt-in resources (default off — existing consumers see no change).
serviceAccount:
  # Create a ServiceAccount and mount it on the Deployment pods.
  create: false
  # Optional explicit name; defaults to the chart fullname when create is true.
  name: ""
  annotations: {}
  automountServiceAccountToken: true

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  # Set exactly one of minAvailable / maxUnavailable (minAvailable wins if both set).
  minAvailable: 1
  # maxUnavailable: 1

networkPolicy:
  enabled: false
  # When true, allow ingress from any pod in the same namespace to the Service port.
  allowSameNamespace: true
  # Extra ingress rules, passed through as-is under spec.ingress.
  extraIngress: []
  # Egress: empty = allow all (no egress rules rendered). Set to restrict.
  # Use [{ }] for "allow all egress" explicitly, or concrete rules.
  egress: []

# One-off Job (migration, backfill, seed). Off by default: k8s-job.yml turns it on for a
# single run via --set. Anything not set here is inherited from the top-level values
# (image, env, envFrom, resources, security contexts, serviceAccount, imagePullSecrets,
# scheduling blocks).
job:
  enabled: false
  # Optional ServiceAccount override; empty inherits the chart's serviceAccount resolution.
  serviceAccountName: ""
  # Name segment of the Job (…-<name>) and of the container.
  name: job
  # Extra suffix appended by k8s-job.yml so repeat runs never collide.
  nameSuffix: ""
  image:
    repository: "" # defaults to image.repository
    tag: "" # defaults to image.tag
    digest: "" # defaults to image.digest
    pullPolicy: "" # defaults to image.pullPolicy
  command: []
  args: []
  # Appended to the top-level env / envFrom (job entries win at runtime).
  env: []
  envFrom: []
  resources: {} # defaults to the top-level resources
  podSecurityContext: {} # defaults to the top-level podSecurityContext
  securityContext: {} # defaults to the top-level securityContext
  restartPolicy: Never
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  # activeDeadlineSeconds: 600
  # parallelism: 1
  # completions: 1
  annotations: {}
  podAnnotations: {}
  podLabels: {}

# Migration Job run as a Helm pre-install/pre-upgrade hook: `helm upgrade` waits for it and
# aborts the release if it fails. Same shape as `job`. Off by default.
migrations:
  enabled: false
  name: migrations
  nameSuffix: ""
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: ""
  command: []
  args: []
  env: []
  envFrom: []
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  restartPolicy: Never
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  # activeDeadlineSeconds: 600
  hook: pre-install,pre-upgrade
  hookWeight: "-5"
  hookDeletePolicy: before-hook-creation
  # ServiceAccount for the migration Job. Empty + serviceAccount.create=true renders a dedicated
  # `<fullname>-migrations` SA as an earlier hook (weight below), because Helm runs pre-install
  # hooks before the chart's own ServiceAccount exists. Set this to reuse an existing SA instead.
  serviceAccountName: ""
  serviceAccountHookWeight: "-10"
  annotations: {}
  podAnnotations: {}
  podLabels: {}

# Scheduled CronJobs, deployed with the app. Each entry takes the same fields as `job`
# (minus enabled/nameSuffix) plus `schedule`; `name` and `schedule` are required.
cronJobs: []
# - name: cleanup
#   schedule: "0 3 * * *"
#   command: ["/app/bin/cleanup"]
#   concurrencyPolicy: Forbid # Allow | Forbid | Replace
#   suspend: false
#   successfulJobsHistoryLimit: 3
#   failedJobsHistoryLimit: 1
#   # timeZone: America/Mexico_City
#   # startingDeadlineSeconds: 120
#   # enabled: false # render nothing for this entry
