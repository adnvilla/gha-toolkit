{{- /* Scheduled CronJobs. `cronJobs` is a list; each entry takes the same shape as
       `job` plus `schedule`. Deployed together with the app by k8s-deploy.yml. */ -}}
{{- range $cron := .Values.cronJobs }}
{{- if ne $cron.enabled false }}
{{- $name := required "each cronJobs entry needs a name" $cron.name }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "app.job.fullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: cronjob
  {{- with $cron.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ required "each cronJobs entry needs a schedule" $cron.schedule | quote }}
  {{- with $cron.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ $cron.suspend | default false }}
  concurrencyPolicy: {{ $cron.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ $cron.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $cron.failedJobsHistoryLimit | default 1 }}
  {{- with $cron.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  jobTemplate:
    metadata:
      labels:
        {{- include "app.labels" $ | nindent 8 }}
        app.kubernetes.io/component: cronjob
    spec:
      {{- include "app.job.spec" (dict "job" $cron) | nindent 6 }}
      template:
        metadata:
          labels:
            {{- include "app.job.podLabels" (dict "root" $ "name" $name) | nindent 12 }}
            {{- with $cron.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $cron.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          {{- include "app.job.podSpec" (dict "root" $ "job" $cron) | nindent 10 }}
{{- end }}
{{- end }}
