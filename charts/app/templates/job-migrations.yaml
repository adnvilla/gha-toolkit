{{- /* Migration Job wired as a Helm pre-install/pre-upgrade hook: `helm upgrade` blocks
       until it succeeds and aborts the release if it fails. Default off. */ -}}
{{- if .Values.migrations.enabled -}}
{{- $job := .Values.migrations -}}
{{- $name := $job.name | default "migrations" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.job.fullname" (dict "root" . "name" $name "suffix" $job.nameSuffix) }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: job
  annotations:
    "helm.sh/hook": {{ $job.hook | default "pre-install,pre-upgrade" }}
    "helm.sh/hook-weight": {{ $job.hookWeight | default "-5" | quote }}
    "helm.sh/hook-delete-policy": {{ $job.hookDeletePolicy | default "before-hook-creation" }}
    {{- with $job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "app.job.spec" (dict "job" $job) | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "app.job.podLabels" (dict "root" . "name" $name) | nindent 8 }}
        {{- with $job.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $job.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "app.job.podSpec" (dict "root" . "job" (merge (dict "name" $name) $job)) | nindent 6 }}
{{- end }}
