{{- /* Blue/green preview Service: routes to the INACTIVE slot so the new version can be
       smoke-tested before promote. Default off. */ -}}
{{- if and (eq (include "app.strategyMode" .) "blueGreen") .Values.blueGreen.preview.enabled -}}
{{- $slot := include "app.blueGreen.inactiveSlot" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.preview.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/slot: {{ $slot }}
    app.kubernetes.io/component: preview
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "app.slot.selectorLabels" (dict "root" . "slot" $slot) | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
{{- end }}
