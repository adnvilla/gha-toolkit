{{- $mode := include "app.strategyMode" . -}}
{{- /* HPA targets the rolling/canary stable Deployment, or the ACTIVE blue/green slot.
       The blueGreen Deployment omits `replicas` for the active slot when this is enabled,
       so Helm and the HPA never fight over the replica count. */ -}}
{{- if .Values.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    {{- if eq $mode "blueGreen" }}
    name: {{ include "app.slot.fullname" (dict "root" . "slot" .Values.blueGreen.activeSlot) }}
    {{- else }}
    name: {{ include "app.fullname" . }}
    {{- end }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
