{{- /* Dedicated ServiceAccount for the migration hook. Helm runs pre-install hooks BEFORE the
       chart's ordinary resources, so a pre-install Job cannot use the ServiceAccount rendered by
       serviceaccount.yaml — on a first install it does not exist yet. This copy carries the same
       annotations (workload identity et al) and runs at a lower hook weight than the Job, so it is
       always in place first. Only rendered when the chart creates the app ServiceAccount and the
       caller has not pointed migrations at an existing one. */ -}}
{{- if and .Values.migrations.enabled .Values.serviceAccount.create (not .Values.migrations.serviceAccountName) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.migrations.serviceAccountName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: job
  annotations:
    "helm.sh/hook": {{ .Values.migrations.hook | default "pre-install,pre-upgrade" }}
    "helm.sh/hook-weight": {{ .Values.migrations.serviceAccountHookWeight | default "-10" | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
