# Reusable workflow for blue/green deployments (e.g. Kafka workers) via Helm (charts/app).
# Phases: deploy (ship inactive slot) → promote | abort, plus status (read-only).
# The toolkit does not talk to Kafka — apps must share the same consumer group.id;
# prefer overlap-seconds=0 unless handlers are idempotent under dual consumers.
# Assumes the runner has a working kubeconfig (see ARCHITECTURE.md).
# For more information see: https://docs.github.com/en/actions/using-workflows/reusing-workflows

name: Kubernetes Blue/Green Deploy

on:
  workflow_call:
    inputs:
      action:
        description: >-
          Blue/green phase: deploy (update inactive slot), promote, abort, or status
          (read the current slots without touching the release).
        required: true
        type: string
      toolkit-ref:
        description: >-
          Optional override for the git ref of adnvilla/gha-toolkit to pull charts/app from.
          Defaults to job.workflow_sha. Ignored when use-local-chart is true.
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Git ref/SHA of the calling repo to check out (for the values file). Pass
          github.event.workflow_run.head_sha explicitly for workflow_run-triggered CD.
        required: false
        type: string
        default: ''
      use-local-chart:
        description: 'Use a chart from the calling repo instead of charts/app from gha-toolkit'
        required: false
        type: boolean
        default: false
      chart-path:
        description: 'Path to the Helm chart'
        required: false
        type: string
        default: 'charts/app'
      release-name:
        description: 'Helm release name'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace (created automatically if missing)'
        required: true
        type: string
      kube-context:
        description: 'kubectl context to deploy to'
        required: true
        type: string
      values-file:
        description: 'Path to the values file in the calling repo'
        required: true
        type: string
      image:
        description: >-
          Full image reference for the inactive slot (action=deploy) or the image being
          promoted. References without a tag use latest. Required for deploy and promote;
          optional for abort.
        required: false
        type: string
        default: ''
      active-slot:
        description: >-
          Override the current active slot (blue|green). When empty, read from the release
          or default to blue.
        required: false
        type: string
        default: ''
      active-replicas:
        description: 'Replica count for the active slot'
        required: false
        type: number
        default: 1
      inactive-replicas:
        description: 'Replica count for the inactive slot on deploy (before promote)'
        required: false
        type: number
        default: 1
      overlap-seconds:
        description: >-
          On promote, keep both slots up this many seconds before scaling the old active
          down (Kafka rebalance overlap). Prefer 0.
        required: false
        type: number
        default: 0
      preview:
        description: >-
          Render the chart's preview Service (and Ingress when the values file enables it) in
          front of the INACTIVE slot, so the new version can be smoke-tested before promote.
        required: false
        type: boolean
        default: false
      verify-url:
        description: >-
          Optional HTTP(S) URL polled after a successful deploy/promote. On deploy point it at
          the preview host (inactive slot); on promote at the live host. Empty disables the check.
        required: false
        type: string
        default: ''
      verify-expect-status:
        description: 'HTTP status code verify-url must return'
        required: false
        type: number
        default: 200
      verify-timeout-seconds:
        description: 'How long verify-url may take to start returning verify-expect-status'
        required: false
        type: number
        default: 120
      verify-interval-seconds:
        description: 'Interval between verify-url probes'
        required: false
        type: number
        default: 5
      auto-abort:
        description: >-
          When verification fails after action=deploy, scale the inactive slot back to 0 (the
          abort path) before failing the workflow, instead of leaving the bad slot running.
        required: false
        type: boolean
        default: false
      helm-set:
        description: 'Additional --set overrides, one KEY=VALUE per line'
        required: false
        type: string
        default: ''
      ingress-prefix:
        description: >-
          Hostname label prepended to INGRESS_BASE_DOMAIN to compose ingress.host
          ({prefix}.{INGRESS_BASE_DOMAIN}). Empty (the default) uses release-name.
          INGRESS_BASE_DOMAIN is read from the caller repo/environment var if set,
          otherwise from the runner env. Composition is skipped when the values
          file already sets ingress.host, when use-local-chart is true, or when
          the base domain is unset. blueGreen.preview.ingress.host still defaults
          to preview.<ingress.host>. Does not auto-fill environment-url.
        required: false
        type: string
        default: ''
      wait:
        description: 'Wait for resources to become ready'
        required: false
        type: boolean
        default: true
      atomic:
        description: 'Roll back automatically if the upgrade fails'
        required: false
        type: boolean
        default: true
      timeout:
        description: 'Time to wait for the rollout, e.g. 180s'
        required: false
        type: string
        default: '180s'
      helm-version:
        description: 'Helm version to install if not already present on the runner'
        required: false
        type: string
        default: 'v3.16.2'
      dry-run:
        description: 'Render with helm template instead of deploying (no cluster access)'
        required: false
        type: boolean
        default: false
      environment:
        description: 'GitHub Environment name for this job'
        required: false
        type: string
        default: 'production'
      environment-url:
        description: 'Optional URL shown next to the environment in the GitHub Actions UI'
        required: false
        type: string
        default: ''
      runs-on:
        description: 'Runner label to execute the job on'
        required: false
        type: string
        default: 'self-hosted'
      timeout-minutes:
        description: 'Maximum job duration in minutes'
        required: false
        type: number
        default: 30
    outputs:
      action:
        description: 'Action that was executed'
        value: ${{ jobs.bluegreen.outputs.action }}
      active-slot:
        description: 'Active slot after this run'
        value: ${{ jobs.bluegreen.outputs.active-slot }}
      inactive-slot:
        description: 'Inactive slot after this run (the one the Service does not select)'
        value: ${{ jobs.bluegreen.outputs.inactive-slot }}
      deployed-slot:
        description: 'Slot that received the new image on deploy (inactive before promote)'
        value: ${{ jobs.bluegreen.outputs.deployed-slot }}
      image:
        description: 'Image reference applied by this run'
        value: ${{ jobs.bluegreen.outputs.image }}

permissions:
  contents: read

jobs:
  bluegreen:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment-url }}
    outputs:
      action: ${{ steps.deploy.outputs.action }}
      active-slot: ${{ steps.deploy.outputs.active-slot }}
      inactive-slot: ${{ steps.deploy.outputs.inactive-slot }}
      deployed-slot: ${{ steps.deploy.outputs.deployed-slot }}
      image: ${{ steps.deploy.outputs.image }}
    steps:
      - name: Validate action
        env:
          ACTION: ${{ inputs.action }}
          ACTIVE_SLOT_INPUT: ${{ inputs.active-slot }}
          IMAGE: ${{ inputs.image }}
        run: |
          case "${ACTION}" in
            deploy|promote|abort|status) ;;
            *)
              echo "::error::action must be deploy, promote, abort, or status (got '${ACTION}')"
              exit 1
              ;;
          esac
          if { [ "${ACTION}" = "deploy" ] || [ "${ACTION}" = "promote" ]; } \
            && [ -z "${IMAGE}" ]; then
            echo "::error::image is required for action=${ACTION}"
            exit 1
          fi
          if [ -n "${ACTIVE_SLOT_INPUT}" ] \
            && [ "${ACTIVE_SLOT_INPUT}" != "blue" ] \
            && [ "${ACTIVE_SLOT_INPUT}" != "green" ]; then
            echo "::error::active-slot must be blue or green (got '${ACTIVE_SLOT_INPUT}')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout gha-toolkit chart
        if: ${{ !inputs.use-local-chart }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.toolkit-ref || job.workflow_sha }}
          path: .gha-toolkit-chart

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ inputs.helm-version }}

      - name: Verify kube context
        if: ${{ !inputs.dry-run }}
        env:
          KUBE_CONTEXT: ${{ inputs.kube-context }}
        run: |
          kubectl --context "${KUBE_CONTEXT}" cluster-info

      - name: Deploy blue/green phase
        id: deploy
        env:
          USE_LOCAL_CHART: ${{ inputs.use-local-chart }}
          CHART_PATH: ${{ inputs.chart-path }}
          RELEASE_NAME: ${{ inputs.release-name }}
          NAMESPACE: ${{ inputs.namespace }}
          VALUES_FILE: ${{ inputs.values-file }}
          IMAGE: ${{ inputs.image }}
          ACTION: ${{ inputs.action }}
          ACTIVE_SLOT_INPUT: ${{ inputs.active-slot }}
          ACTIVE_REPLICAS: ${{ inputs.active-replicas }}
          INACTIVE_REPLICAS: ${{ inputs.inactive-replicas }}
          OVERLAP_SECONDS: ${{ inputs.overlap-seconds }}
          PREVIEW: ${{ inputs.preview }}
          VERIFY_URL: ${{ inputs.verify-url }}
          VERIFY_EXPECT_STATUS: ${{ inputs.verify-expect-status }}
          VERIFY_TIMEOUT_SECONDS: ${{ inputs.verify-timeout-seconds }}
          VERIFY_INTERVAL_SECONDS: ${{ inputs.verify-interval-seconds }}
          AUTO_ABORT: ${{ inputs.auto-abort }}
          HELM_SET: ${{ inputs.helm-set }}
          INGRESS_PREFIX: ${{ inputs.ingress-prefix }}
          INGRESS_BASE_DOMAIN_VAR: ${{ vars.INGRESS_BASE_DOMAIN }}
          WAIT: ${{ inputs.wait }}
          ATOMIC: ${{ inputs.atomic }}
          TIMEOUT: ${{ inputs.timeout }}
          DRY_RUN: ${{ inputs.dry-run }}
          KUBE_CONTEXT: ${{ inputs.kube-context }}
        run: |
          set -euo pipefail

          if [ "${USE_LOCAL_CHART}" == "true" ]; then
            CHART_DIR="${CHART_PATH}"
          else
            CHART_DIR=".gha-toolkit-chart/${CHART_PATH}"
          fi

          read_release_json() {
            if [ "${DRY_RUN}" == "true" ]; then
              echo "{}"
              return
            fi
            if helm status "${RELEASE_NAME}" -n "${NAMESPACE}" --kube-context "${KUBE_CONTEXT}" >/dev/null 2>&1; then
              helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -a -o json --kube-context "${KUBE_CONTEXT}"
            else
              echo "{}"
            fi
          }

          VALUES_JSON="$(read_release_json)"

          # Parse active slot + per-slot images from the current release (or defaults).
          eval "$(
            VALUES_JSON="${VALUES_JSON}" ACTIVE_SLOT_INPUT="${ACTIVE_SLOT_INPUT}" python3 <<'PY'
          import json, os
          v = json.loads(os.environ.get("VALUES_JSON") or "{}")
          bg = v.get("blueGreen") or {}
          img = v.get("image") or {}
          active = os.environ.get("ACTIVE_SLOT_INPUT") or bg.get("activeSlot") or "blue"
          blue = (bg.get("blue") or {}).get("image") or {}
          green = (bg.get("green") or {}).get("image") or {}
          fallback_repo = img.get("repository") or ""
          fallback_tag = img.get("tag") or "latest"
          fallback_digest = img.get("digest") or ""
          def image_parts(slot):
              slot_repo = slot.get("repository") or ""
              slot_tag = slot.get("tag") or ""
              slot_digest = slot.get("digest") or ""
              # A slot with any explicit image field is an override. In particular, a tagged
              # slot must not inherit an active slot top-level digest.
              if not (slot_repo or slot_tag or slot_digest):
                  slot_digest = fallback_digest
              return [slot_repo or fallback_repo, slot_tag or fallback_tag, slot_digest]
          blue_repo, blue_tag, blue_digest = image_parts(blue)
          green_repo, green_tag, green_digest = image_parts(green)
          print("ACTIVE_SLOT=%r" % active)
          print("BLUE_REPO=%r" % blue_repo)
          print("BLUE_TAG=%r" % blue_tag)
          print("BLUE_DIGEST=%r" % blue_digest)
          print("GREEN_REPO=%r" % green_repo)
          print("GREEN_TAG=%r" % green_tag)
          print("GREEN_DIGEST=%r" % green_digest)
          PY
          )"

          if [ "${ACTIVE_SLOT}" = "blue" ]; then
            INACTIVE_SLOT="green"
          else
            INACTIVE_SLOT="blue"
          fi

          IMAGE_REPO=""
          IMAGE_TAG=""
          IMAGE_DIGEST=""
          if [ -n "${IMAGE}" ]; then
            IMAGE_REPO="${IMAGE}"
            IMAGE_TAG="latest"
            if [[ "${IMAGE}" == *@* ]]; then
              IMAGE_REPO="${IMAGE%@*}"
              IMAGE_TAG=""
              IMAGE_DIGEST="${IMAGE#*@}"
            elif [[ "${IMAGE}" == *:* ]]; then
              IMAGE_REPO="${IMAGE%:*}"
              IMAGE_TAG="${IMAGE##*:}"
            fi
            if [ "${USE_LOCAL_CHART}" == "true" ] && [ -n "${IMAGE_DIGEST}" ]; then
              IMAGE_REPO="${IMAGE%:*}"
              IMAGE_TAG="${IMAGE##*:}"
              IMAGE_DIGEST=""
            fi
          fi

          # Defaults when no prior release (dry-run / first install).
          if [ -z "${BLUE_REPO}" ] && [ -n "${IMAGE_REPO}" ]; then
            BLUE_REPO="${IMAGE_REPO}"
            BLUE_TAG="${IMAGE_TAG}"
            BLUE_DIGEST="${IMAGE_DIGEST}"
          fi
          if [ -z "${GREEN_REPO}" ] && [ -n "${IMAGE_REPO}" ]; then
            GREEN_REPO="${IMAGE_REPO}"
            GREEN_TAG="${IMAGE_TAG}"
            GREEN_DIGEST="${IMAGE_DIGEST}"
          fi

          # status is read-only: report the slots and the live image, touch nothing.
          if [ "${ACTION}" == "status" ]; then
            if [ "${ACTIVE_SLOT}" = "blue" ]; then
              LIVE_REPO="${BLUE_REPO}"; LIVE_TAG="${BLUE_TAG}"; LIVE_DIGEST="${BLUE_DIGEST}"
            else
              LIVE_REPO="${GREEN_REPO}"; LIVE_TAG="${GREEN_TAG}"; LIVE_DIGEST="${GREEN_DIGEST}"
            fi
            if [ -n "${LIVE_DIGEST}" ]; then
              LIVE_IMAGE="${LIVE_REPO}@${LIVE_DIGEST}"
            else
              LIVE_IMAGE="${LIVE_REPO}:${LIVE_TAG}"
            fi
            echo "active slot: ${ACTIVE_SLOT} (${LIVE_IMAGE})"
            echo "inactive slot: ${INACTIVE_SLOT}"
            {
              echo "action=status"
              echo "active-slot=${ACTIVE_SLOT}"
              echo "inactive-slot=${INACTIVE_SLOT}"
              echo "deployed-slot="
              echo "image=${LIVE_IMAGE}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          BLUE_REPLICAS="${ACTIVE_REPLICAS}"
          GREEN_REPLICAS="0"
          if [ "${ACTIVE_SLOT}" = "green" ]; then
            BLUE_REPLICAS="0"
            GREEN_REPLICAS="${ACTIVE_REPLICAS}"
          fi

          NEW_ACTIVE="${ACTIVE_SLOT}"
          DEPLOYED_SLOT=""

          case "${ACTION}" in
            deploy)
              DEPLOYED_SLOT="${INACTIVE_SLOT}"
              if [ "${INACTIVE_SLOT}" = "green" ]; then
                GREEN_REPO="${IMAGE_REPO}"
                GREEN_TAG="${IMAGE_TAG}"
                GREEN_DIGEST="${IMAGE_DIGEST}"
                GREEN_REPLICAS="${INACTIVE_REPLICAS}"
              else
                BLUE_REPO="${IMAGE_REPO}"
                BLUE_TAG="${IMAGE_TAG}"
                BLUE_DIGEST="${IMAGE_DIGEST}"
                BLUE_REPLICAS="${INACTIVE_REPLICAS}"
              fi
              # Active slot keeps consuming; do not change its replicas/image here.
              if [ "${ACTIVE_SLOT}" = "blue" ]; then
                BLUE_REPLICAS="${ACTIVE_REPLICAS}"
              else
                GREEN_REPLICAS="${ACTIVE_REPLICAS}"
              fi
              ;;
            promote)
              DEPLOYED_SLOT="${INACTIVE_SLOT}"
              NEW_ACTIVE="${INACTIVE_SLOT}"
              if [ -n "${IMAGE_REPO}" ]; then
                if [ "${INACTIVE_SLOT}" = "green" ]; then
                  GREEN_REPO="${IMAGE_REPO}"; GREEN_TAG="${IMAGE_TAG}"; GREEN_DIGEST="${IMAGE_DIGEST}"
                else
                  BLUE_REPO="${IMAGE_REPO}"; BLUE_TAG="${IMAGE_TAG}"; BLUE_DIGEST="${IMAGE_DIGEST}"
                fi
              fi
              if [ "${OVERLAP_SECONDS}" -gt 0 ] && [ "${DRY_RUN}" != "true" ]; then
                # Brief dual-run: both slots up, then flip.
                if [ "${INACTIVE_SLOT}" = "green" ]; then
                  GREEN_REPLICAS="${ACTIVE_REPLICAS}"
                  BLUE_REPLICAS="${ACTIVE_REPLICAS}"
                else
                  BLUE_REPLICAS="${ACTIVE_REPLICAS}"
                  GREEN_REPLICAS="${ACTIVE_REPLICAS}"
                fi
              else
                if [ "${NEW_ACTIVE}" = "blue" ]; then
                  BLUE_REPLICAS="${ACTIVE_REPLICAS}"
                  GREEN_REPLICAS="0"
                else
                  GREEN_REPLICAS="${ACTIVE_REPLICAS}"
                  BLUE_REPLICAS="0"
                fi
              fi
              ;;
            abort)
              DEPLOYED_SLOT="${INACTIVE_SLOT}"
              NEW_ACTIVE="${ACTIVE_SLOT}"
              if [ "${INACTIVE_SLOT}" = "green" ]; then
                GREEN_REPLICAS="0"
                BLUE_REPLICAS="${ACTIVE_REPLICAS}"
              else
                BLUE_REPLICAS="0"
                GREEN_REPLICAS="${ACTIVE_REPLICAS}"
              fi
              ;;
          esac

          # Top-level image mirrors the active slot (useful for tooling/docs).
          if [ "${NEW_ACTIVE}" = "blue" ]; then
            TOP_REPO="${BLUE_REPO}"; TOP_TAG="${BLUE_TAG}"
            TOP_DIGEST="${BLUE_DIGEST}"
          else
            TOP_REPO="${GREEN_REPO}"; TOP_TAG="${GREEN_TAG}"
            TOP_DIGEST="${GREEN_DIGEST}"
          fi

          # Same ingress.host composition as k8s-deploy.yml: extra -f before the
          # caller's values so an existing host is not clobbered; skip local charts.
          COMPOSED_INGRESS_FILE=""
          INGRESS_COMPOSE_PREFIX="${INGRESS_PREFIX:-}"
          [ -z "${INGRESS_COMPOSE_PREFIX}" ] && INGRESS_COMPOSE_PREFIX="${RELEASE_NAME}"
          INGRESS_COMPOSE_BASE="${INGRESS_BASE_DOMAIN_VAR:-${INGRESS_BASE_DOMAIN:-}}"
          if [ "${USE_LOCAL_CHART}" != "true" ] && [ -n "${INGRESS_COMPOSE_BASE}" ]; then
            COMPOSED_INGRESS_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/gha-toolkit-ingress-host.XXXXXX")"
            printf 'ingress:\n  host: "%s"\n' \
              "${INGRESS_COMPOSE_PREFIX}.${INGRESS_COMPOSE_BASE}" > "${COMPOSED_INGRESS_FILE}"
            echo "Composed ingress.host=${INGRESS_COMPOSE_PREFIX}.${INGRESS_COMPOSE_BASE}"
          fi

          # Rebuilt from the current slot variables before every apply (promote with an
          # overlap window applies twice with different replica counts).
          build_render_args() {
            RENDER_ARGS=(
              -n "${NAMESPACE}"
            )
            if [ -n "${COMPOSED_INGRESS_FILE}" ]; then
              RENDER_ARGS+=(-f "${COMPOSED_INGRESS_FILE}")
            fi
            RENDER_ARGS+=(
              -f "${VALUES_FILE}"
              --set "strategy.mode=blueGreen"
              --set "blueGreen.activeSlot=${NEW_ACTIVE}"
              --set "blueGreen.overlapSeconds=${OVERLAP_SECONDS}"
              --set "image.repository=${TOP_REPO}"
              --set "image.tag=${TOP_TAG}"
              --set "image.digest=${TOP_DIGEST}"
              --set "blueGreen.blue.image.repository=${BLUE_REPO}"
              --set "blueGreen.blue.image.tag=${BLUE_TAG}"
              --set "blueGreen.blue.image.digest=${BLUE_DIGEST}"
              --set "blueGreen.blue.replicas=${BLUE_REPLICAS}"
              --set "blueGreen.green.image.repository=${GREEN_REPO}"
              --set "blueGreen.green.image.tag=${GREEN_TAG}"
              --set "blueGreen.green.image.digest=${GREEN_DIGEST}"
              --set "blueGreen.green.replicas=${GREEN_REPLICAS}"
            )
            # Only force the preview on: leaving it unset lets the values file decide.
            if [ "${PREVIEW}" == "true" ]; then
              RENDER_ARGS+=(--set "blueGreen.preview.enabled=true")
            fi
            while IFS= read -r kv; do
              [ -z "$kv" ] && continue
              RENDER_ARGS+=(--set "$kv")
            done <<< "${HELM_SET}"
          }

          build_render_args

          helm_apply() {
            if [ "${DRY_RUN}" == "true" ]; then
              helm template "${RELEASE_NAME}" "${CHART_DIR}" "${RENDER_ARGS[@]}"
            else
              ARGS=(
                upgrade --install "${RELEASE_NAME}" "${CHART_DIR}"
                "${RENDER_ARGS[@]}"
                --create-namespace
                --timeout "${TIMEOUT}"
                --kube-context "${KUBE_CONTEXT}"
              )
              [ "${WAIT}" == "true" ] && ARGS+=(--wait)
              [ "${ATOMIC}" == "true" ] && ARGS+=(--atomic)
              helm "${ARGS[@]}"
            fi
          }

          helm_apply

          # Promote with overlap: after both are up, scale old active to 0 and flip Service.
          if [ "${ACTION}" == "promote" ] && [ "${OVERLAP_SECONDS}" -gt 0 ] && [ "${DRY_RUN}" != "true" ]; then
            echo "Overlapping both slots for ${OVERLAP_SECONDS}s before cutting over"
            sleep "${OVERLAP_SECONDS}"
            if [ "${NEW_ACTIVE}" = "blue" ]; then
              GREEN_REPLICAS="0"
              BLUE_REPLICAS="${ACTIVE_REPLICAS}"
            else
              BLUE_REPLICAS="0"
              GREEN_REPLICAS="${ACTIVE_REPLICAS}"
            fi
            build_render_args
            helm_apply
          fi

          # Health gate. On deploy the URL should point at the preview host (inactive slot);
          # on promote at the live host. Skipped in dry-run, which never reaches a cluster.
          verify_slot() {
            local deadline=$((SECONDS + VERIFY_TIMEOUT_SECONDS))
            local code=""
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${VERIFY_URL}" || echo "000")"
              if [ "${code}" = "${VERIFY_EXPECT_STATUS}" ]; then
                echo "Verified ${VERIFY_URL} -> ${code}"
                return 0
              fi
              echo "Waiting for ${VERIFY_URL} (last status ${code}, want ${VERIFY_EXPECT_STATUS})"
              sleep "${VERIFY_INTERVAL_SECONDS}"
            done
            echo "::error::${VERIFY_URL} did not return ${VERIFY_EXPECT_STATUS}" \
              "within ${VERIFY_TIMEOUT_SECONDS}s (last ${code})"
            return 1
          }

          if [ -n "${VERIFY_URL}" ] && [ "${DRY_RUN}" != "true" ] \
            && { [ "${ACTION}" == "deploy" ] || [ "${ACTION}" == "promote" ]; }; then
            if ! verify_slot; then
              if [ "${AUTO_ABORT}" == "true" ] && [ "${ACTION}" == "deploy" ]; then
                echo "::warning::Verification failed — aborting: scaling ${INACTIVE_SLOT} back to 0"
                NEW_ACTIVE="${ACTIVE_SLOT}"
                if [ "${INACTIVE_SLOT}" = "green" ]; then
                  GREEN_REPLICAS="0"
                  BLUE_REPLICAS="${ACTIVE_REPLICAS}"
                else
                  BLUE_REPLICAS="0"
                  GREEN_REPLICAS="${ACTIVE_REPLICAS}"
                fi
                if [ "${NEW_ACTIVE}" = "blue" ]; then
                  TOP_REPO="${BLUE_REPO}"; TOP_TAG="${BLUE_TAG}"
                else
                  TOP_REPO="${GREEN_REPO}"; TOP_TAG="${GREEN_TAG}"
                fi
                build_render_args
                helm_apply
              fi
              exit 1
            fi
          fi

          OUT_IMAGE="${IMAGE}"
          if [ -z "${OUT_IMAGE}" ]; then
            if [ -n "${TOP_DIGEST}" ]; then
              OUT_IMAGE="${TOP_REPO}@${TOP_DIGEST}"
            else
              OUT_IMAGE="${TOP_REPO}:${TOP_TAG}"
            fi
          fi

          {
            echo "action=${ACTION}"
            echo "active-slot=${NEW_ACTIVE}"
            echo "inactive-slot=$([ "${NEW_ACTIVE}" = "blue" ] && echo green || echo blue)"
            echo "deployed-slot=${DEPLOYED_SLOT}"
            echo "image=${OUT_IMAGE}"
          } >> "${GITHUB_OUTPUT}"
