# Reusable workflow for semantic versioning releases
# For more information see: https://docs.github.com/en/actions/using-workflows/reusing-workflows

name: Semantic Release

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version for semantic-release'
        required: false
        type: string
        # semantic-release@^25 requires Node ^22.14.0 || >= 24.10.0.
        default: '22'
      dry-run:
        description: 'Run semantic-release in dry-run mode'
        required: false
        type: boolean
        default: false
      runs-on:
        description: 'Runner label to execute the job on'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Maximum job duration in minutes'
        required: false
        type: number
        default: 15
    secrets:
      github-token:
        description: 'GitHub token for creating releases'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}

      # A reusable workflow runs in the caller's repository. Check out the toolkit
      # at the exact commit that supplied this workflow so its lockfile remains
      # coupled to the workflow implementation, including when a fork is used.
      - name: Checkout locked release toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gha-toolkit-release

      - name: Install semantic-release
        env:
          RELEASE_TOOLS_DIR: ${{ github.workspace }}/.gha-toolkit-release/tools/release
        run: |
          npm ci --ignore-scripts --prefix "${RELEASE_TOOLS_DIR}"
          npm ls --omit=dev --depth=0 --prefix "${RELEASE_TOOLS_DIR}"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_TOOLS_DIR: ${{ github.workspace }}/.gha-toolkit-release/tools/release
        run: |
          if [ "${DRY_RUN}" == "true" ]; then
            npx --prefix "${RELEASE_TOOLS_DIR}" --no-install semantic-release --dry-run
          else
            npx --prefix "${RELEASE_TOOLS_DIR}" --no-install semantic-release
          fi
