# Test workflow to validate that reusable workflows work correctly
# This workflow only runs manually (workflow_dispatch)
#
# Coverage notes:
# - `ref` is exercised on docker-build-push and k8s-deploy (explicit github.sha),
#   with a follow-up job asserting docker's short-sha output matches that ref.
# - k8s-canary / k8s-bluegreen are dry-run smoke-tested for deploy/promote/abort.
# - k8s-job is dry-run smoke-tested for action=run only: trigger/suspend/resume-cronjob all
#   need a live CronJob, so they are covered by tests/k8s-job-run.sh instead.
# - `adopt-existing` is NOT smoke-tested here: k8s-deploy skips it when
#   dry-run is true, and a real run needs a disposable cluster/namespace.
#   Validate that path manually against an isolated namespace when changing it.

name: Test Workflows

on:
  workflow_dispatch:
    inputs:
      run-go:
        description: 'Test go.yml'
        type: boolean
        default: false
      run-release:
        description: 'Test release.yml (dry-run)'
        type: boolean
        default: false
      run-node:
        description: 'Test node.yml (this repo has no Node project, so build/lint/typecheck/test are skipped)'
        type: boolean
        default: false
      run-python:
        description: >-
          Test python.yml (this repo has no Python project, so format/lint/typecheck/build/test are skipped)
        type: boolean
        default: false
      run-rust:
        description: 'Test rust.yml (this repo has no Rust project, so fmt/clippy/build/test are skipped)'
        type: boolean
        default: false
      run-docker-build-push:
        description: 'Test docker-build-push.yml against a fixture Dockerfile (build only, no push; exercises ref)'
        type: boolean
        default: false
      run-k8s-deploy:
        description: 'Test k8s-deploy.yml (helm template dry-run + ref; no cluster; adopt-existing not covered)'
        type: boolean
        default: false
      run-k8s-canary:
        description: 'Test k8s-canary.yml (helm template dry-run for deploy/promote/abort; no cluster)'
        type: boolean
        default: false
      run-k8s-bluegreen:
        description: 'Test k8s-bluegreen.yml (helm template dry-run for deploy/promote/abort; no cluster)'
        type: boolean
        default: false
      run-k8s-job:
        description: 'Test k8s-job.yml (helm template dry-run of the Job manifest; no cluster)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-go-workflow:
    if: ${{ github.event.inputs.run-go == 'true' }}
    uses: ./.github/workflows/go.yml
    with:
      go-version: '1.24'
      run-tests: false  # This repo doesn't have Go code
      timeout-minutes: 30

  test-release-workflow:
    if: ${{ github.event.inputs.run-release == 'true' }}
    # semantic-release --dry-run verifies that this token could push a release.
    # The reusable workflow cannot elevate the caller's GITHUB_TOKEN permissions.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      dry-run: true  # Always in dry-run for this repo
      timeout-minutes: 15
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  test-node-workflow:
    if: ${{ github.event.inputs.run-node == 'true' }}
    uses: ./.github/workflows/node.yml
    with:
      node-version: '20'
      run-build: false
      run-lint: false
      run-typecheck: false
      run-tests: false  # This repo has no Node project; validates workflow plumbing only
      timeout-minutes: 30

  test-python-workflow:
    if: ${{ github.event.inputs.run-python == 'true' }}
    uses: ./.github/workflows/python.yml
    with:
      python-version: '3.12'
      run-format: false
      run-lint: false
      run-typecheck: false
      run-build: false
      run-tests: false  # This repo has no Python project; validates workflow plumbing only
      timeout-minutes: 30

  test-rust-workflow:
    if: ${{ github.event.inputs.run-rust == 'true' }}
    uses: ./.github/workflows/rust.yml
    with:
      rust-version: 'stable'
      run-fmt: false
      run-clippy: false
      run-build: false
      run-tests: false  # This repo has no Rust project; validates workflow plumbing only
      postgres-enabled: false
      timeout-minutes: 30

  test-docker-build-push-workflow:
    if: ${{ github.event.inputs.run-docker-build-push == 'true' }}
    uses: ./.github/workflows/docker-build-push.yml
    with:
      # Explicit ref: smoke-test that checkout honors inputs.ref (the workflow_run
      # head_sha path from #4) instead of silently using the run's default SHA.
      ref: ${{ github.sha }}
      dockerfile: .github/test-fixtures/Dockerfile
      context: .github/test-fixtures
      image-name: gha-toolkit-smoke-test
      registry-host: registry.example.local:5000
      push: false
      timeout-minutes: 30

  verify-docker-build-push-ref:
    needs: test-docker-build-push-workflow
    if: ${{ github.event.inputs.run-docker-build-push == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Confirm short-sha matches the explicit ref
        env:
          ACTUAL: ${{ needs.test-docker-build-push-workflow.outputs.short-sha }}
        run: |
          EXPECTED="$(git rev-parse --short=7 HEAD)"
          echo "expected=${EXPECTED} actual=${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::docker-build-push short-sha (${ACTUAL}) != ref short-sha (${EXPECTED})"
            exit 1
          fi

  test-k8s-deploy-workflow:
    if: ${{ github.event.inputs.run-k8s-deploy == 'true' }}
    uses: ./.github/workflows/k8s-deploy.yml
    with:
      toolkit-ref: ${{ github.ref_name }}
      # Explicit ref: exercises values-file checkout at the caller-supplied SHA.
      ref: ${{ github.sha }}
      release-name: smoke-test
      namespace: smoke-test
      kube-context: unused-in-dry-run
      values-file: charts/app/values.yaml
      image: registry.example.local:5000/smoke-test:latest
      dry-run: true
      environment: 'test'
      timeout-minutes: 20
      # adopt-existing intentionally omitted — skipped under dry-run and needs a
      # real cluster when enabled; see file header.

  test-k8s-canary-deploy:
    if: ${{ github.event.inputs.run-k8s-canary == 'true' }}
    uses: ./.github/workflows/k8s-canary.yml
    with:
      action: deploy
      toolkit-ref: ${{ github.ref_name }}
      ref: ${{ github.sha }}
      release-name: smoke-canary
      namespace: smoke-canary
      kube-context: unused-in-dry-run
      values-file: charts/app/values.yaml
      image: registry.example.local:5000/smoke-canary:canary
      stable-image: registry.example.local:5000/smoke-canary:stable
      canary-weight: 10
      dry-run: true
      environment: 'test'
      runs-on: ubuntu-latest
      timeout-minutes: 20

  test-k8s-canary-promote:
    if: ${{ github.event.inputs.run-k8s-canary == 'true' }}
    uses: ./.github/workflows/k8s-canary.yml
    with:
      action: promote
      toolkit-ref: ${{ github.ref_name }}
      ref: ${{ github.sha }}
      release-name: smoke-canary
      namespace: smoke-canary
      kube-context: unused-in-dry-run
      values-file: charts/app/values.yaml
      image: registry.example.local:5000/smoke-canary:canary
      dry-run: true
      environment: 'test'
      runs-on: ubuntu-latest
      timeout-minutes: 20

  test-k8s-canary-abort:
    if: ${{ github.event.inputs.run-k8s-canary == 'true' }}
    uses: ./.github/workflows/k8s-canary.yml
    with:
      action: abort
      toolkit-ref: ${{ github.ref_name }}
      ref: ${{ github.sha }}
      release-name: smoke-canary
      namespace: smoke-canary
      kube-context: unused-in-dry-run
      values-file: charts/app/values.yaml
      stable-image: registry.example.local:5000/smoke-canary:stable
      dry-run: true
      environment: 'test'
      runs-on: ubuntu-latest
      timeout-minutes: 20

  test-k8s-bluegreen-deploy:
    if: ${{ github.event.inputs.run-k8s-bluegreen == 'true' }}
    uses: ./.github/workflows/k8s-bluegreen.yml
    with:
      action: deploy
      toolkit-ref: ${{ github.ref_name }}
      ref: ${{ github.sha }}
      release-name: smoke-worker
      namespace: smoke-worker
      kube-context: unused-in-dry-run
      values-file: charts/app/values.yaml
      image: registry.example.local:5000/smoke-worker:new
      active-slot: blue
      dry-run: true
      environment: 'test'
      runs-on: ubuntu-latest
      timeout-minutes: 30

  test-k8s-bluegreen-promote:
    if: ${{ github.event.inputs.run-k8s-bluegreen == 'true' }}
    uses: ./.github/workflows/k8s-bluegreen.yml
    with:
      action: promote
      toolkit-ref: ${{ github.ref_name }}
      ref: ${{ github.sha }}
      release-name: smoke-worker
      namespace: smoke-worker
      kube-context: unused-in-dry-run
      values-file: charts/app/values.yaml
      image: registry.example.local:5000/smoke-worker:new
      active-slot: blue
      dry-run: true
      environment: 'test'
      runs-on: ubuntu-latest
      timeout-minutes: 30

  test-k8s-bluegreen-abort:
    if: ${{ github.event.inputs.run-k8s-bluegreen == 'true' }}
    uses: ./.github/workflows/k8s-bluegreen.yml
    with:
      action: abort
      toolkit-ref: ${{ github.ref_name }}
      ref: ${{ github.sha }}
      release-name: smoke-worker
      namespace: smoke-worker
      kube-context: unused-in-dry-run
      values-file: charts/app/values.yaml
      active-slot: blue
      dry-run: true
      environment: 'test'
      runs-on: ubuntu-latest
      timeout-minutes: 30

  test-k8s-job-run:
    if: ${{ github.event.inputs.run-k8s-job == 'true' }}
    uses: ./.github/workflows/k8s-job.yml
    with:
      action: run
      toolkit-ref: ${{ github.ref_name }}
      ref: ${{ github.sha }}
      release-name: smoke-job
      namespace: smoke-job
      kube-context: unused-in-dry-run
      values-file: charts/app/values.yaml
      image: registry.example.local:5000/smoke-job:v1
      job-name: migrate
      command: |
        /bin/sh
        -c
      args: |
        echo "smoke test"
      dry-run: true
      environment: 'test'
      runs-on: ubuntu-latest
      timeout-minutes: 35
