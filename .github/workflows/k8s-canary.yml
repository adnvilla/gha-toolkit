# Reusable workflow for canary deployments of HTTP APIs via Helm (charts/app).
# Phases are explicit: deploy (ship canary) → promote | abort.
# Assumes the runner has a working kubeconfig (see ARCHITECTURE.md).
# For more information see: https://docs.github.com/en/actions/using-workflows/reusing-workflows

name: Kubernetes Canary Deploy

on:
  workflow_call:
    inputs:
      action:
        description: 'Canary phase: deploy (roll out canary), promote (make canary stable), or abort'
        required: true
        type: string
      toolkit-ref:
        description: >-
          Optional override for the git ref of adnvilla/gha-toolkit to pull charts/app from.
          Defaults to job.workflow_sha. Ignored when use-local-chart is true.
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Git ref/SHA of the calling repo to check out (for the values file). Pass
          github.event.workflow_run.head_sha explicitly for workflow_run-triggered CD.
        required: false
        type: string
        default: ''
      use-local-chart:
        description: 'Use a chart from the calling repo instead of charts/app from gha-toolkit'
        required: false
        type: boolean
        default: false
      chart-path:
        description: 'Path to the Helm chart'
        required: false
        type: string
        default: 'charts/app'
      release-name:
        description: 'Helm release name'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace (created automatically if missing)'
        required: true
        type: string
      kube-context:
        description: 'kubectl context to deploy to'
        required: true
        type: string
      values-file:
        description: 'Path to the values file in the calling repo'
        required: true
        type: string
      image:
        description: >-
          Full image reference for the canary (action=deploy) or the image to promote to
          stable (action=promote). References without a tag use latest. Ignored for abort
          unless you also pass stable-image.
        required: false
        type: string
        default: ''
      stable-image:
        description: >-
          Optional full image reference for the stable Deployment. When empty on deploy,
          the workflow keeps the release's current image (or uses image if no release yet).
          References without a tag use latest.
        required: false
        type: string
        default: ''
      canary-weight:
        description: 'Traffic % to canary when canary.trafficProvider=traefik (0–100)'
        required: false
        type: number
        default: 10
      canary-replicas:
        description: 'Canary Deployment replicas on deploy'
        required: false
        type: number
        default: 1
      helm-set:
        description: 'Additional --set overrides, one KEY=VALUE per line'
        required: false
        type: string
        default: ''
      ingress-prefix:
        description: >-
          Hostname label prepended to INGRESS_BASE_DOMAIN to compose ingress.host
          ({prefix}.{INGRESS_BASE_DOMAIN}). Empty (the default) uses release-name.
          INGRESS_BASE_DOMAIN is read from the caller repo/environment var if set,
          otherwise from the runner env. Composition is skipped when the values
          file already sets ingress.host, when use-local-chart is true, or when
          the base domain is unset. canary.ingress.host still defaults to
          canary.<ingress.host>. Does not auto-fill environment-url.
        required: false
        type: string
        default: ''
      wait:
        description: 'Wait for resources to become ready'
        required: false
        type: boolean
        default: true
      atomic:
        description: 'Roll back automatically if the upgrade fails'
        required: false
        type: boolean
        default: true
      timeout:
        description: 'Time to wait for the rollout, e.g. 180s'
        required: false
        type: string
        default: '180s'
      helm-version:
        description: 'Helm version to install if not already present on the runner'
        required: false
        type: string
        default: 'v3.16.2'
      dry-run:
        description: 'Render with helm template instead of deploying (no cluster access)'
        required: false
        type: boolean
        default: false
      environment:
        description: 'GitHub Environment name for this job'
        required: false
        type: string
        default: 'production'
      environment-url:
        description: 'Optional URL shown next to the environment in the GitHub Actions UI'
        required: false
        type: string
        default: ''
      runs-on:
        description: 'Runner label to execute the job on'
        required: false
        type: string
        default: 'self-hosted'
      timeout-minutes:
        description: 'Maximum job duration in minutes'
        required: false
        type: number
        default: 20
    outputs:
      action:
        description: 'Action that was executed'
        value: ${{ jobs.canary.outputs.action }}
      image:
        description: 'Canary or promoted image reference'
        value: ${{ jobs.canary.outputs.image }}
      stable-image:
        description: 'Stable image reference after this run'
        value: ${{ jobs.canary.outputs.stable-image }}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment-url }}
    outputs:
      action: ${{ steps.deploy.outputs.action }}
      image: ${{ steps.deploy.outputs.image }}
      stable-image: ${{ steps.deploy.outputs.stable-image }}
    steps:
      - name: Validate action
        env:
          ACTION: ${{ inputs.action }}
          IMAGE: ${{ inputs.image }}
        run: |
          case "${ACTION}" in
            deploy|promote|abort) ;;
            *)
              echo "::error::action must be deploy, promote, or abort (got '${ACTION}')"
              exit 1
              ;;
          esac
          if [ "${ACTION}" != "abort" ] && [ -z "${IMAGE}" ]; then
            echo "::error::image is required for action=${ACTION}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout gha-toolkit chart
        if: ${{ !inputs.use-local-chart }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.toolkit-ref || job.workflow_sha }}
          path: .gha-toolkit-chart

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ inputs.helm-version }}

      - name: Verify kube context
        if: ${{ !inputs.dry-run }}
        env:
          KUBE_CONTEXT: ${{ inputs.kube-context }}
        run: |
          kubectl --context "${KUBE_CONTEXT}" cluster-info

      - name: Deploy canary phase
        id: deploy
        env:
          USE_LOCAL_CHART: ${{ inputs.use-local-chart }}
          CHART_PATH: ${{ inputs.chart-path }}
          RELEASE_NAME: ${{ inputs.release-name }}
          NAMESPACE: ${{ inputs.namespace }}
          VALUES_FILE: ${{ inputs.values-file }}
          IMAGE: ${{ inputs.image }}
          STABLE_IMAGE_INPUT: ${{ inputs.stable-image }}
          ACTION: ${{ inputs.action }}
          CANARY_WEIGHT: ${{ inputs.canary-weight }}
          CANARY_REPLICAS: ${{ inputs.canary-replicas }}
          HELM_SET: ${{ inputs.helm-set }}
          INGRESS_PREFIX: ${{ inputs.ingress-prefix }}
          INGRESS_BASE_DOMAIN_VAR: ${{ vars.INGRESS_BASE_DOMAIN }}
          WAIT: ${{ inputs.wait }}
          ATOMIC: ${{ inputs.atomic }}
          TIMEOUT: ${{ inputs.timeout }}
          DRY_RUN: ${{ inputs.dry-run }}
          KUBE_CONTEXT: ${{ inputs.kube-context }}
        run: |
          set -euo pipefail

          if [ "${USE_LOCAL_CHART}" == "true" ]; then
            CHART_DIR="${CHART_PATH}"
          else
            CHART_DIR=".gha-toolkit-chart/${CHART_PATH}"
          fi

          read_release_json() {
            if [ "${DRY_RUN}" == "true" ]; then
              echo "{}"
              return
            fi
            if helm status "${RELEASE_NAME}" -n "${NAMESPACE}" --kube-context "${KUBE_CONTEXT}" >/dev/null 2>&1; then
              helm get values "${RELEASE_NAME}" -n "${NAMESPACE}" -a -o json --kube-context "${KUBE_CONTEXT}"
            else
              echo "{}"
            fi
          }

          VALUES_JSON="$(read_release_json)"

          # Stable + canary images currently recorded in the release (empty when there is none).
          # Values travel through the environment: `python3 <<'PY'` already owns stdin.
          eval "$(
            VALUES_JSON="${VALUES_JSON}" python3 <<'PY'
          import json, os
          v = json.loads(os.environ.get("VALUES_JSON") or "{}") or {}
          img = v.get("image") or {}
          cimg = (v.get("canary") or {}).get("image") or {}
          print("CUR_REPO=%r" % (img.get("repository") or ""))
          print("CUR_TAG=%r" % (img.get("tag") or ""))
          print("CUR_DIGEST=%r" % (img.get("digest") or ""))
          print("CUR_CANARY_REPO=%r" % (cimg.get("repository") or ""))
          print("CUR_CANARY_TAG=%r" % (cimg.get("tag") or ""))
          print("CUR_CANARY_DIGEST=%r" % (cimg.get("digest") or ""))
          PY
          )"

          # Resolve stable image: explicit input > current release > canary image (first install).
          STABLE_IMAGE="${STABLE_IMAGE_INPUT}"
          if [ -z "${STABLE_IMAGE}" ] && [ -n "${CUR_REPO}" ]; then
            if [ -n "${CUR_DIGEST}" ]; then
              STABLE_IMAGE="${CUR_REPO}@${CUR_DIGEST}"
            elif [ -n "${CUR_TAG}" ]; then
              STABLE_IMAGE="${CUR_REPO}:${CUR_TAG}"
            fi
          fi
          if [ -z "${STABLE_IMAGE}" ]; then
            STABLE_IMAGE="${IMAGE}"
          fi

          split_image_ref() {
            local ref="$1"
            PARSED_REPO="${ref}"
            PARSED_TAG="latest"
            PARSED_DIGEST=""
            if [[ "${ref}" == *@* ]]; then
              PARSED_REPO="${ref%@*}"
              PARSED_TAG=""
              PARSED_DIGEST="${ref#*@}"
            elif [[ "${ref}" == *:* ]]; then
              PARSED_REPO="${ref%:*}"
              PARSED_TAG="${ref##*:}"
            fi
          }

          image_ref() {
            if [ -n "$3" ]; then
              printf '%s@%s' "$1" "$3"
            else
              printf '%s:%s' "$1" "$2"
            fi
          }

          split_image_ref "${STABLE_IMAGE}"
          STABLE_REPO="${PARSED_REPO}"
          STABLE_TAG="${PARSED_TAG}"
          STABLE_DIGEST="${PARSED_DIGEST}"

          CANARY_REPO=""
          CANARY_TAG=""
          CANARY_DIGEST=""
          if [ -n "${IMAGE}" ]; then
            split_image_ref "${IMAGE}"
            CANARY_REPO="${PARSED_REPO}"
            CANARY_TAG="${PARSED_TAG}"
            CANARY_DIGEST="${PARSED_DIGEST}"
          fi

          # Same ingress.host composition as k8s-deploy.yml: extra -f before the
          # caller's values so an existing host is not clobbered; skip local charts.
          COMPOSED_INGRESS_FILE=""
          INGRESS_COMPOSE_PREFIX="${INGRESS_PREFIX:-}"
          [ -z "${INGRESS_COMPOSE_PREFIX}" ] && INGRESS_COMPOSE_PREFIX="${RELEASE_NAME}"
          INGRESS_COMPOSE_BASE="${INGRESS_BASE_DOMAIN_VAR:-${INGRESS_BASE_DOMAIN:-}}"
          if [ "${USE_LOCAL_CHART}" != "true" ] && [ -n "${INGRESS_COMPOSE_BASE}" ]; then
            COMPOSED_INGRESS_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/gha-toolkit-ingress-host.XXXXXX")"
            printf 'ingress:\n  host: "%s"\n' \
              "${INGRESS_COMPOSE_PREFIX}.${INGRESS_COMPOSE_BASE}" > "${COMPOSED_INGRESS_FILE}"
            echo "Composed ingress.host=${INGRESS_COMPOSE_PREFIX}.${INGRESS_COMPOSE_BASE}"
          fi

          RENDER_ARGS=(
            -n "${NAMESPACE}"
          )
          if [ -n "${COMPOSED_INGRESS_FILE}" ]; then
            RENDER_ARGS+=(-f "${COMPOSED_INGRESS_FILE}")
          fi
          RENDER_ARGS+=(
            -f "${VALUES_FILE}"
            --set "strategy.mode=canary"
            --set "image.repository=${STABLE_REPO}"
            --set "image.tag=${STABLE_TAG}"
            --set "image.digest=${STABLE_DIGEST}"
          )

          case "${ACTION}" in
            deploy)
              RENDER_ARGS+=(
                --set "canary.image.repository=${CANARY_REPO}"
                --set "canary.image.tag=${CANARY_TAG}"
                --set "canary.image.digest=${CANARY_DIGEST}"
                --set "canary.replicas=${CANARY_REPLICAS}"
                --set "canary.weight=${CANARY_WEIGHT}"
              )
              OUT_IMAGE="${IMAGE}"
              OUT_STABLE="${STABLE_IMAGE}"
              ;;
            promote)
              # Canary becomes the new stable; scale canary down and clear weight.
              RENDER_ARGS+=(
                --set "image.repository=${CANARY_REPO}"
                --set "image.tag=${CANARY_TAG}"
                --set "image.digest=${CANARY_DIGEST}"
                --set "canary.image.repository=${CANARY_REPO}"
                --set "canary.image.tag=${CANARY_TAG}"
                --set "canary.image.digest=${CANARY_DIGEST}"
                --set "canary.replicas=0"
                --set "canary.weight=0"
              )
              OUT_IMAGE="${IMAGE}"
              OUT_STABLE="${IMAGE}"
              ;;
            abort)
              # Keep stable; tear down canary. Prefer canary image from release if present.
              if [ -z "${CANARY_REPO}" ] && [ -n "${CUR_CANARY_REPO}" ]; then
                CANARY_REPO="${CUR_CANARY_REPO}"
                CANARY_TAG="${CUR_CANARY_TAG}"
                CANARY_DIGEST="${CUR_CANARY_DIGEST}"
              fi
              if [ -z "${CANARY_REPO}" ]; then
                CANARY_REPO="${STABLE_REPO}"
                CANARY_TAG="${STABLE_TAG}"
                CANARY_DIGEST="${STABLE_DIGEST}"
              fi
              RENDER_ARGS+=(
                --set "canary.image.repository=${CANARY_REPO}"
                --set "canary.image.tag=${CANARY_TAG}"
                --set "canary.image.digest=${CANARY_DIGEST}"
                --set "canary.replicas=0"
                --set "canary.weight=0"
              )
              OUT_IMAGE="$(image_ref "${CANARY_REPO}" "${CANARY_TAG}" "${CANARY_DIGEST}")"
              OUT_STABLE="${STABLE_IMAGE}"
              ;;
          esac

          echo "Resolved stable image: $(image_ref "${STABLE_REPO}" "${STABLE_TAG}" "${STABLE_DIGEST}")"
          echo "Resolved canary image: $(image_ref "${CANARY_REPO}" "${CANARY_TAG}" "${CANARY_DIGEST}")"

          while IFS= read -r kv; do
            [ -z "$kv" ] && continue
            RENDER_ARGS+=(--set "$kv")
          done <<< "${HELM_SET}"

          if [ "${DRY_RUN}" == "true" ]; then
            helm template "${RELEASE_NAME}" "${CHART_DIR}" "${RENDER_ARGS[@]}"
          else
            ARGS=(
              upgrade --install "${RELEASE_NAME}" "${CHART_DIR}"
              "${RENDER_ARGS[@]}"
              --create-namespace
              --timeout "${TIMEOUT}"
              --kube-context "${KUBE_CONTEXT}"
            )
            [ "${WAIT}" == "true" ] && ARGS+=(--wait)
            [ "${ATOMIC}" == "true" ] && ARGS+=(--atomic)
            helm "${ARGS[@]}"

            if [ "${WAIT}" == "true" ] && [ "${ACTION}" == "deploy" ]; then
              kubectl --context "${KUBE_CONTEXT}" get deploy -n "${NAMESPACE}" \
                -l "app.kubernetes.io/instance=${RELEASE_NAME}-canary,app.kubernetes.io/track=canary" \
                -o name | while read -r d; do
                  [ -z "$d" ] && continue
                  kubectl --context "${KUBE_CONTEXT}" rollout status "$d" -n "${NAMESPACE}" --timeout="${TIMEOUT}"
                done
            fi
          fi

          {
            echo "action=${ACTION}"
            echo "image=${OUT_IMAGE}"
            echo "stable-image=${OUT_STABLE}"
          } >> "${GITHUB_OUTPUT}"
