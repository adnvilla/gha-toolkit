# CI workflow for gha-toolkit
# This workflow validates workflow syntax and generates automatic releases

name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate Workflow Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate YAML syntax
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          config_file: .yamllint.yml
          file_or_dir: .github/workflows/
          strict: false

      - name: Reject actions that still use Node.js 20
        run: bash tests/action-node24-versions.sh

  validate-actions:
    name: Validate Workflow Semantics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # yamllint only checks YAML style. actionlint checks Actions semantics:
      # context/property names, expression types, `needs` references, action
      # input names, and (via its bundled shellcheck) the `run:` scripts.
      # The image pins actionlint AND shellcheck, so a runner image update
      # cannot silently change the result. Ignores live in .github/actionlint.yaml.
      - name: Run actionlint
        run: |
          docker run --rm -v "${PWD}:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12 -color

      # tests/*.sh are standalone scripts, not `run:` bodies, so actionlint never
      # looks at them. Reuse the shellcheck the image already carries.
      - name: Run shellcheck on the shell-logic tests
        run: |
          docker run --rm -v "${PWD}:/repo:ro" -w /repo \
            --entrypoint shellcheck rhysd/actionlint:1.7.12 tests/*.sh

  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Markdown files
        uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1 # v3.5.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_files: node_modules/

  validate-chart:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2

      - name: Lint chart
        run: helm lint charts/app

      - name: Render chart with sample values
        run: |
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=test \
            --set ingress.enabled=true \
            --set ingress.host=test.local > /dev/null

      - name: Render chart with optional resources enabled
        run: |
          # Catch template errors in SA/HPA/PDB/NetworkPolicy (all default-off).
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=test \
            --set serviceAccount.create=true \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true > /dev/null

      - name: Render chart in canary mode
        run: |
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=stable \
            --set strategy.mode=canary \
            --set canary.image.repository=registry.example.local:5000/test-app \
            --set canary.image.tag=canary \
            --set canary.replicas=1 \
            --set canary.ingress.enabled=true \
            --set ingress.enabled=true \
            --set ingress.host=api.local > /dev/null
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=stable \
            --set strategy.mode=canary \
            --set canary.trafficProvider=traefik \
            --set canary.weight=10 \
            --set canary.image.repository=registry.example.local:5000/test-app \
            --set canary.image.tag=canary \
            --set ingress.enabled=true \
            --set ingress.host=api.local > /dev/null

      - name: Render chart in blueGreen mode
        run: |
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=blue \
            --set strategy.mode=blueGreen \
            --set blueGreen.activeSlot=blue \
            --set blueGreen.blue.image.repository=registry.example.local:5000/test-app \
            --set blueGreen.blue.image.tag=blue \
            --set blueGreen.blue.replicas=1 \
            --set blueGreen.green.image.repository=registry.example.local:5000/test-app \
            --set blueGreen.green.image.tag=green \
            --set blueGreen.green.replicas=1 > /dev/null
          # Same mode with the preview Service/Ingress, an HPA and a PDB on the active slot.
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=blue \
            --set strategy.mode=blueGreen \
            --set blueGreen.activeSlot=blue \
            --set blueGreen.blue.image.repository=registry.example.local:5000/test-app \
            --set blueGreen.blue.image.tag=blue \
            --set blueGreen.green.image.repository=registry.example.local:5000/test-app \
            --set blueGreen.green.image.tag=green \
            --set blueGreen.green.replicas=1 \
            --set blueGreen.preview.enabled=true \
            --set blueGreen.preview.ingress.enabled=true \
            --set ingress.enabled=true \
            --set ingress.host=api.local \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true > /dev/null

      - name: Render Job, migrations hook and CronJobs
        run: |
          # One-off Job as k8s-job.yml renders it (default off, so this is the only coverage).
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=test \
            --set job.enabled=true \
            --set job.name=migrate \
            --set job.nameSuffix=ci \
            --set-json 'job.command=["/app/bin/migrate","up"]' \
            --show-only templates/job.yaml > /dev/null
          # Migration Job as the pre-upgrade Helm hook used by k8s-deploy.yml.
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=test \
            --set migrations.enabled=true \
            --set-json 'migrations.command=["/app/bin/migrate"]' \
            --show-only templates/job-migrations.yaml > /dev/null
          # CronJobs, including the per-entry disable switch.
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=test \
            --set cronJobs[0].name=cleanup \
            --set cronJobs[0].schedule='0 3 * * *' \
            --set-json 'cronJobs[0].command=["/app/bin/cleanup"]' \
            --set cronJobs[1].name=report \
            --set cronJobs[1].schedule='@daily' \
            --set cronJobs[1].enabled=false \
            --show-only templates/cronjob.yaml > /dev/null
          # Reserved selector labels must survive a hostile podLabels override, a CronJob name
          # must stay within the Kubernetes 52-character cap, and a history limit of 0 must not
          # be swallowed by Helm's `default`.
          rendered="$(helm template a-very-long-release-name-for-testing charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=test \
            --set job.enabled=true \
            --set job.name=migrate \
            --set 'job.podLabels.app\.kubernetes\.io/instance=hijacked' \
            --show-only templates/job.yaml)"
          if grep -q 'instance: hijacked' <<< "${rendered}"; then
            echo "::error::job.podLabels overrode a reserved selector label"
            exit 1
          fi
          rendered="$(helm template a-very-long-release-name-for-testing charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=test \
            --set cronJobs[0].name=a-rather-long-cronjob-entry-name \
            --set cronJobs[0].schedule='@daily' \
            --set cronJobs[0].successfulJobsHistoryLimit=0 \
            --show-only templates/cronjob.yaml)"
          name="$(awk '/^  name:/ { print $2; exit }' <<< "${rendered}")"
          if [ "${#name}" -gt 52 ]; then
            echo "::error::rendered CronJob name '${name}' is ${#name} chars, over the 52 limit"
            exit 1
          fi
          if ! grep -q 'successfulJobsHistoryLimit: 0' <<< "${rendered}"; then
            echo "::error::successfulJobsHistoryLimit=0 was replaced by the default"
            exit 1
          fi
          # The migration hook must not reference a ServiceAccount that pre-install has not
          # created yet: it gets its own, at a lower hook weight.
          helm template test-release charts/app \
            --set image.repository=registry.example.local:5000/test-app \
            --set image.tag=test \
            --set migrations.enabled=true \
            --set serviceAccount.create=true \
            --show-only templates/serviceaccount-migrations.yaml > /dev/null

  validate-shell-logic:
    name: Validate Workflow Shell Logic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install 'pyyaml~=6.0'

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2

      - name: Test k8s-canary image resolution
        run: bash tests/canary-image-resolution.sh

      - name: Test Kubernetes image references
        run: bash tests/k8s-image-references.sh

      - name: Test ingress host composition
        run: bash tests/ingress-host-composition.sh

      - name: Test k8s-bluegreen slot flipping
        run: bash tests/bluegreen-slot-flip.sh

      - name: Test k8s-job execution
        run: bash tests/k8s-job-run.sh

      - name: Test Kubernetes context isolation
        run: bash tests/k8s-context-isolation.sh

      - name: Test workflow run expression isolation
        run: bash tests/no-inline-run-expressions.sh

      - name: Test workflow permissions
        run: bash tests/workflow-permissions.sh

      - name: Test workflow timeouts
        run: bash tests/workflow-timeouts.sh

      - name: Test Python workflow commands
        run: bash tests/python-workflow.sh

      - name: Test release rules release breaking changes as major
        run: bash tests/release-rules.sh

      - name: Test locked release toolchain
        run: bash tests/release-toolchain.sh

  validate-doc-pins:
    name: Validate Documentation Version Pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm every workflows/*.yml@ref pin in the docs exists at that ref
        run: |
          set -euo pipefail
          # PR checkouts only materialize the PR branch as a local ref. Branch
          # pins like @master (documented in README) need origin/<branch>, and
          # tags need an explicit fetch — otherwise this job passes on master
          # pushes and fails on every PR that references a branch pin.
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet
          FAIL=0
          while read -r pin; do
            rest="${pin#adnvilla/gha-toolkit/}"
            path="${rest%@*}"
            ref="${rest##*@}"
            # Version/tag pins (e.g. @v1.5.0, @1.5.0) are immutable and public — they
            # MUST resolve at that exact ref, so a consumer copying the example never
            # gets a broken `uses:`. Documenting an unreleased version still fails here.
            #
            # Branch pins (e.g. @master) mean "latest": the file only needs to exist in
            # the code under review (HEAD). After this PR merges, the branch will contain
            # it — so adding a new workflow + its @master docs passes in a single PR
            # instead of the old chicken-and-egg where @master wasn't on origin/master yet.
            if [[ "${ref}" =~ ^v?[0-9] ]]; then
              if git show "${ref}:${path}" > /dev/null 2>&1; then
                echo "OK   ${path}@${ref} (tag)"
              else
                echo "::error::${path} does not exist at tag/version ref '${ref}' (referenced in docs)"
                FAIL=1
              fi
            else
              if git show "HEAD:${path}" > /dev/null 2>&1 \
                || git show "${ref}:${path}" > /dev/null 2>&1 \
                || git show "origin/${ref}:${path}" > /dev/null 2>&1; then
                echo "OK   ${path}@${ref} (branch)"
              else
                echo "::error::${path} does not exist at ref '${ref}' or in HEAD (referenced in docs)"
                FAIL=1
              fi
            fi
          done < <(grep -ohE 'adnvilla/gha-toolkit/\.github/workflows/[A-Za-z0-9_-]+\.yml@[A-Za-z0-9._/-]+' \
            README.md EXAMPLES.md ENVIRONMENTS.md | sort -u)
          exit $FAIL

  # This job always passes, it's just to have a consolidated status
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validate-workflows
      - validate-actions
      - validate-markdown
      - validate-chart
      - validate-shell-logic
      - validate-doc-pins
    if: always()
    steps:
      - name: Check CI Status
        env:
          VALIDATE_WORKFLOWS_RESULT: ${{ needs.validate-workflows.result }}
          VALIDATE_ACTIONS_RESULT: ${{ needs.validate-actions.result }}
          VALIDATE_CHART_RESULT: ${{ needs.validate-chart.result }}
          VALIDATE_SHELL_LOGIC_RESULT: ${{ needs.validate-shell-logic.result }}
          VALIDATE_DOC_PINS_RESULT: ${{ needs.validate-doc-pins.result }}
          VALIDATE_MARKDOWN_RESULT: ${{ needs.validate-markdown.result }}
        run: |
          if [ "${VALIDATE_WORKFLOWS_RESULT}" != "success" ]; then
            echo "Workflow validation failed"
            exit 1
          fi
          if [ "${VALIDATE_ACTIONS_RESULT}" != "success" ]; then
            echo "Workflow semantic validation (actionlint) failed"
            exit 1
          fi
          if [ "${VALIDATE_CHART_RESULT}" != "success" ]; then
            echo "Helm chart validation failed"
            exit 1
          fi
          if [ "${VALIDATE_SHELL_LOGIC_RESULT}" != "success" ]; then
            echo "Workflow shell logic tests failed"
            exit 1
          fi
          if [ "${VALIDATE_DOC_PINS_RESULT}" != "success" ]; then
            echo "Documentation version pin validation failed"
            exit 1
          fi
          if [ "${VALIDATE_MARKDOWN_RESULT}" != "success" ]; then
            echo "Markdown validation failed (warning only)"
          fi
          echo "CI Complete ✅"
