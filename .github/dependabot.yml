version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/release
    schedule:
      interval: weekly
    ignore:
      # Major 10 needs conventional-changelog-writer@9, but the stable
      # @semantic-release/release-notes-generator@14 still ships writer@8, so
      # release notes fail to render. Lift once release-notes-generator@15 is stable.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: ['>=10']
    groups:
      release-toolchain:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
